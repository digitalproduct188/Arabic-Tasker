name: AutoFlow Cloud Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من تطبيق GitHub على الهاتف

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # يلغي البناء القديم تلقائياً إذا دفعت تعديلاً جديداً بسرعة

jobs:
  build-and-test:
    name: Test & Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (JUnit 5)
        run: ./gradlew testDebugUnitTest :core:engine:test --stacktrace

      - name: Run Static Analysis (ktlint & detekt)
        run: ./gradlew ktlintCheck detekt
        continue-on-error: true # لا يوقف استخراج الـ APK بسبب خطأ تنسيق بسيط أثناء التطوير

      - name: Assemble Debug APKs (Play & Full Flavors)
        run: ./gradlew :app:assemblePlayDebug :app:assembleFullDebug --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          retention-days: 5

      - name: Upload Ready-to-Install APKs
        uses: actions/upload-artifact@v4
        with:
          name: autoflow-debug-apks
          path: |
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/apk/full/debug/*.apk
          retention-days: 14
          
